services:
  mariadb_db:
    image: mariadb:11.4.2 
    container_name: mariadb_db
# 🔹 CORRIGIDO: Formato de lista (Array), à prova de erros de indentação
    command: [
      "--enforce-storage-engine=InnoDB",
      "--explicit_defaults_for_timestamp=1",
      "--local-infile=1",
      "--sql-mode=",
      "--disable-log-bin",
      "--innodb_buffer_pool_size=1G",
      "--innodb_log_buffer_size=256M",
      "--innodb_flush_log_at_trx_commit=2"
    ]
    deploy:
      resources:
        limits:
          memory: 1536M  # Limita o container a no máximo 1.5 GB de RAM
          cpus: '2.0'    # Limita o container a no máximo 2 núcleos de CPU
    restart: always
    ports:
      # Acesso ao banco de dados por um programa externo (como DBeaver, MySQL Workbench ou HeidiSQL)
      - "3306:3306"
    environment:
      # Configurações de credenciais enviadas por você
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      # Garante a persistência dos dados no seu computador
      - db_data:/var/lib/mysql
      # 🔹 NOVA LINHA AQUI: Mapeia seus arquivos SQL locais para a pasta de inicialização do container
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    networks:
      - jedieduca-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: phpmyadmin_container
    restart: always
    ports:
      # Acessa a interface visual do banco por http://localhost:8080
      - "8080:80"
    environment:
      PMA_HOST: mariadb_db
      PMA_PORT: 3306
      PMA_ARBITRARY: 1
    networks:
      - jedieduca-network

volumes:
  db_data: # Define o volume persistente do banco de dados

networks:
  jedieduca-network:
    external: true # Conecta à rede global que já criamos